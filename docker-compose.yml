services:
  discord-bot:
    build: .
    container_name: discord-whisper-bot
    restart: unless-stopped
    env_file:
      - .env
    models:
      - summarizer
    volumes:
      - ./recordings:/app/recordings

models:
  summarizer:
    model: hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
    context_size: 262144